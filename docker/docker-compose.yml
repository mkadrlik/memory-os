# Memory OS — Docker Compose
#
# Starts Qdrant (vector DB), Redis (job queue), and ARQ Worker (embedding pipeline).
# Copy .env.example to .env and fill in required values before running.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        : > /usr/local/etc/redis/redis.conf &&
        if [ -n "$${REDIS_PASSWORD}" ]; then
          echo "requirepass $${REDIS_PASSWORD}" >> /usr/local/etc/redis/redis.conf;
        fi &&
        echo "bind 0.0.0.0" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "maxmemory 512mb" >> /usr/local/etc/redis/redis.conf &&
        echo "maxmemory-policy noeviction" >> /usr/local/etc/redis/redis.conf &&
        redis-server /usr/local/etc/redis/redis.conf
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # read at runtime by redis-cli; keeps the password out of the healthcheck
      # command line (and therefore out of `docker inspect`)
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    entrypoint: ["/bin/sh", "-c", "if [ -z \"$${QDRANT__SERVICE__API_KEY}\" ]; then unset QDRANT__SERVICE__API_KEY; fi; exec ./entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q ':18BD' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMS: "${EMBEDDING_DIMS:-4096}"
      COLLECTION_NAME: "${COLLECTION_NAME:-knowledge_base}"
      ARQ_JOB_TIMEOUT: "300"
      ARQ_MAX_JOBS: "10"
      ARQ_KEEP_RESULT: "3600"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4-flash:cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      STATE_DB_PATH: /hermes/state.db
      WIKI_PATH: /wiki
    volumes:
      - ${MEMORY_OS_WIKI_PATH:-./wiki}:/wiki:ro
      - ${MEMORY_OS_HERMES_HOME:-./hermes}:/hermes:rw
      - ${MEMORY_OS_FABRIC_DIR:-./fabric}:/fabric:rw
    extra_hosts:
      # `host.docker.internal` is the documented default for a local LLM
      # (OLLAMA_BASE_URL) and for a local embedding endpoint. Docker Desktop
      # resolves it automatically; on Linux it has to be mapped explicitly.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Verifies the worker can reach Redis with auth — if this passes the ARQ
      # event loop is operational.  Overrides the Dockerfile HEALTHCHECK which
      # does not include REDIS_PASSWORD.
      test: ["CMD-SHELL", "python -c \"import os,redis; r=redis.Redis(host='redis',port=6379,password=os.environ.get('REDIS_PASSWORD') or None,socket_connect_timeout=3); r.ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  qdrant_data:
